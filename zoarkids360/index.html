<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZoarKids 360 - Acceso</title>
    <link rel="stylesheet" href="style.css?v=7.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="body-login">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <img src="logo.png" alt="ZoarKids 360" class="splash-logo-grande" onerror="this.style.display='none'">
        <h2 class="splash-titulo">ZoarKids 360</h2>
        <p class="splash-subtitulo">Sistema de Gestión Infantil</p>
        <div class="spinner-carga"></div>
    </div>

    <!-- TARJETA DE LOGIN -->
    <div class="tarjeta-login" id="tarjeta-login">
        <img src="logo.png" alt="ZoarKids" class="logo-login-grande" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 80%22%3E%3Crect fill=%22%232575fc%22 width=%22200%22 height=%2280%22 rx=%2210%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2230%22 font-weight=%22bold%22 font-family=%22sans-serif%22%3EZK 360%3C/text%3E%3C/svg%3E'">

        <h1>ZoarKids 360</h1>
        <p class="sub">Acceso seguro al sistema</p>

        <form id="form-login">
            <div class="campo">
                <label><i class="fa-regular fa-envelope"></i> Correo electrónico</label>
                <div class="wrapper-input">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="correo" class="input-txt" placeholder="nombre@iglesiazoarsv.org" required autocomplete="email">
                </div>
            </div>
            <div class="campo">
                <label><i class="fa-solid fa-lock"></i> Contraseña</label>
                <div class="wrapper-input">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="clave" class="input-txt" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn-ingresar">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar
            </button>
        </form>

        <!-- CAPA DE BLOQUEO -->
        <div class="bloqueo-overlay" id="capa-bloqueo">
            <i class="fa-solid fa-lock"></i>
            <h3>Demasiados intentos</h3>
            <p class="bloqueo-mensaje">Acceso temporalmente bloqueado.<br>Espere <span id="contador">01:00</span></p>
        </div>
    </div>

    <div class="globo-fondo gf-1"></div>
    <div class="globo-fondo gf-2"></div>

    <script src="logica.js?v=7.0"></script>
</body>
</html>
